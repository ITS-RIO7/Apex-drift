name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare Scaffolding & Build APK
        run: |
          # 1. Switch to flutter_app directory if present
          if [ -d "flutter_app" ] && [ -f "flutter_app/pubspec.yaml" ]; then
            cd flutter_app
          fi
          echo "Current working directory: $(pwd)"

          # 2. Recreate clean official Android platform files to ensure gradlew, gradle-wrapper.jar, and plugin versions match runner
          rm -rf android
          flutter create --platforms=android --org com.apexdrift --project-name apex_drift_3d .

          # 3. Ensure gradlew is executable
          chmod +x android/gradlew

          # 4. Fetch dependencies
          flutter pub get

          # 5. Build Android Release APK
          flutter build apk --release

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApexDrift-3D-Android-APK
          path: |
            **/build/app/outputs/flutter-apk/app-release.apk
            **/build/app/outputs/apk/release/*.apk
          if-no-files-found: error
