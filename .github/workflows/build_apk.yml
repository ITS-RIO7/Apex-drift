name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare Android Project & Gradle Wrapper
        run: |
          # 1. Switch to flutter_app directory if present
          if [ -d "flutter_app" ] && [ -f "flutter_app/pubspec.yaml" ]; then
            cd flutter_app
          fi
          echo "Target Directory: $(pwd)"

          # 2. Ensure gradle/wrapper directory exists
          mkdir -p android/gradle/wrapper

          # 3. Ensure gradle-wrapper.jar is present
          if [ ! -f "android/gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Downloading official gradle-wrapper.jar..."
            curl -sLo android/gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/flutter/flutter/master/packages/flutter_tools/templates/app_shared/android.tmpl/gradle/wrapper/gradle-wrapper.jar.tmpl || \
            curl -sLo android/gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar
          fi

          # 4. Make gradlew executable
          chmod +x android/gradlew

          # 5. Fetch dependencies
          flutter pub get

      - name: Build Android Release APK
        run: |
          if [ -d "flutter_app" ] && [ -f "flutter_app/pubspec.yaml" ]; then
            cd flutter_app
          fi
          flutter build apk --release --no-tree-shake-icons

      - name: Upload Android Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ApexDrift-3D-Android-APK
          path: |
            **/build/app/outputs/flutter-apk/app-release.apk
            **/build/app/outputs/apk/release/*.apk
          if-no-files-found: error
