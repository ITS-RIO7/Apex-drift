name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Android Release APK
        run: |
          # 1. Determine where the source code is located
          if [ -d "flutter_app/lib" ]; then
            SRC_DIR="flutter_app"
          else
            SRC_DIR="."
          fi
          echo "Found source code in: $SRC_DIR"

          # 2. Create a clean, official, untouched Flutter project in /tmp
          rm -rf /tmp/app_build
          flutter create --org com.apexdrift --project-name apex_drift_3d /tmp/app_build

          # 3. Copy our game source code and pubspec into the pristine Flutter project
          cp "$SRC_DIR/pubspec.yaml" /tmp/app_build/pubspec.yaml
          rm -rf /tmp/app_build/lib
          cp -r "$SRC_DIR/lib" /tmp/app_build/lib

          # 4. Navigate into the pristine project
          cd /tmp/app_build

          # 5. Fetch dependencies and build Release APK
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

          # 6. Copy output APK to workspace
          mkdir -p "$GITHUB_WORKSPACE/build/app/outputs/flutter-apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/build/app/outputs/flutter-apk/app-release.apk"

      - name: Upload Android Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ApexDrift-3D-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
